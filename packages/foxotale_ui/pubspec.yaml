name: foxotale_ui
description: FoxOtale Design System v1 as Flutter code — colour, type and spacing tokens plus the shared widgets built on them.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  foxotale_domain:
    path: ../foxotale_domain

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - assets/brand/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-Regular.ttf
          weight: 400
        - asset: assets/fonts/Lora-SemiBold.ttf
          weight: 600
